<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Ciclo de Refrigeração com Three.js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="info">
        <h1>Ciclo de Refrigeração - Chiller com Água Gelada</h1>
        <button id="startButton">Iniciar Ciclo</button>
        <div id="tooltip"></div>
    </div>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.skypack.dev/three@0.148.0",
            "three/examples/jsm/controls/OrbitControls.js": "https://cdn.skypack.dev/three@0.148.0/examples/jsm/controls/OrbitControls",
            "three/examples/jsm/loaders/FontLoader.js": "https://cdn.skypack.dev/three@0.148.0/examples/jsm/loaders/FontLoader.js",
            "three/examples/jsm/geometries/TextGeometry.js": "https://cdn.skypack.dev/three@0.148.0/examples/jsm/geometries/TextGeometry.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
